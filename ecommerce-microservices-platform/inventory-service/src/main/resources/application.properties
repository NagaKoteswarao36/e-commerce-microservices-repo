spring.application.name=inventory-service
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_inventory_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=tiger
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory-service

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.order.service,com.ecommerce.inventory.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.inventory.kafka.OrderCreatedEvent

management.endpoints.web.exposure.include=health,info,metrics

spring.config.import=optional:configserver:http://localhost:8888
