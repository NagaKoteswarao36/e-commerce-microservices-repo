spring.application.name=notification-service
server.port=8087

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.payment.kafka,com.ecommerce.notification.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.notification.kafka.PaymentCompletedEvent

management.endpoints.web.exposure.include=health,info,metrics

spring.config.import=optional:configserver:http://localhost:8888
