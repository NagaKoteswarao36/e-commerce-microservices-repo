services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: ecommerce-redis
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.9.1
    container_name: ecommerce-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  service-registry:
    build:
      context: .
      dockerfile: docker/service-registry.Dockerfile
    ports: ["8761:8761"]
    depends_on: [kafka]

  config-server:
    build:
      context: .
      dockerfile: docker/config-server.Dockerfile
    ports: ["8888:8888"]
    depends_on: [service-registry]

  api-gateway:
    build:
      context: .
      dockerfile: docker/api-gateway.Dockerfile
    ports: ["8080:8080"]
    depends_on: [service-registry, config-server]

  user-service:
    build:
      context: .
      dockerfile: docker/user-service.Dockerfile
    ports: ["8081:8081"]
    depends_on: [mysql, service-registry, config-server]

  product-service:
    build:
      context: .
      dockerfile: docker/product-service.Dockerfile
    ports: ["8082:8082"]
    depends_on: [mysql, redis, service-registry, config-server]

  order-service:
    build:
      context: .
      dockerfile: docker/order-service.Dockerfile
    ports: ["8083:8083"]
    depends_on: [mysql, kafka, service-registry, config-server]

  payment-service:
    build:
      context: .
      dockerfile: docker/payment-service.Dockerfile
    ports: ["8084:8084"]
    depends_on: [mysql, kafka, service-registry, config-server]

  inventory-service:
    build:
      context: .
      dockerfile: docker/inventory-service.Dockerfile
    ports: ["8085:8085"]
    depends_on: [mysql, kafka, service-registry, config-server]

  auth-service:
    build:
      context: .
      dockerfile: docker/auth-service.Dockerfile
    ports: ["8086:8086"]
    depends_on: [service-registry, config-server]

  notification-service:
    build:
      context: .
      dockerfile: docker/notification-service.Dockerfile
    ports: ["8087:8087"]
    depends_on: [kafka, service-registry, config-server]

volumes:
  mysql-data:
